[pytest]
pythonpath = . src
testpaths = tests

# Медленные проверки — те, что каждый раз поднимают ОКНО (Qt) или БРАУЗЕР.
# Их 71 из 1116, а времени они берут 14 секунд из 22: не потому, что плохо
# написаны, а потому, что окно строится честно, со всеми сорока семью
# виджетами, и в этом весь смысл. Изоляцию тестов ради секунд ломать не
# будем — вместо этого их можно пропустить, пока пишешь код:
#
#     python -m pytest -q -m "not slow"     быстрый круг, ~8 секунд
#     python -m pytest -q                   всё, как на прогоне
#
# Прогон на GitHub гоняет ВСЁ и метку не смотрит.
markers =
    slow: поднимает окно Qt или браузер — секунды, а не миллисекунды
