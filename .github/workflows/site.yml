# Витрина пересобирается сама на каждый пуш в main.
#
# Раньше docs/ собирался только руками на машине Ярослава. Забыл прогнать
# refresh_assets — и сайт показывает вчерашний набор виджетов, а заметить это
# можно только открыв его глазами и посчитав карточки.
#
# Собирается ровно тем же tools/build_site.py, что и локально: второй копии
# вёрстки нет. Если сборка что-то поменяла — коммитим обратно в main, и
# GitHub Pages подхватывает сам.
name: site

on:
  push:
    branches: [main]
    # Правки, которые витрины не касаются, гонять сборку не должны.
    paths:
      - "overlay/**"
      - "src/ire/dashboard/**"
      - "docs/news/**"
      - "tools/build_site.py"
      - "tools/build_catalog.py"
      - "tools/render_*.py"
      - "tools/refresh_assets.py"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: write          # нужно, чтобы вернуть пересобранный docs/ в main

concurrency:
  # Два пуша подряд — вторая сборка отменяет первую: коммитить в main из
  # двух заданий одновременно значит гарантированно поймать конфликт.
  group: site
  cancel-in-progress: false

# Вывод инструментов русский, а консоль раннера — cp437. Без этой строки
# первая же печатная строка роняет шаг с UnicodeEncodeError, и прогон падает
# ещё до тестов. Скрипты чинят это и сами, но переменная видна глазами.
env:
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # shell: bash — не прихоть. Оболочка по умолчанию на Windows это
        # pwsh, и она смотрит код ТОЛЬКО последней команды: упавший
        # `pip install -r requirements.txt` спрятался бы за успешным
        # `pip install pyinstaller`, и сборка пошла бы дальше без половины
        # зависимостей. bash на GitHub запускается с `set -eo pipefail` и
        # падает на первой же ошибке.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rebuild the catalogue, the shots and the site
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/refresh_assets.py

      - name: The site has no broken links
        # build_site отдаёт ненулевой код, когда остался серверный адрес:
        # пропущенный /w/fuel.png на Pages — это дыра вместо виджета.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/build_site.py --check

      - name: Commit the rebuilt site
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Снимки PNG отличаются от запуска к запуску (шрифты, сглаживание,
          # живая демо-секунда), и коммитить их каждый раз значит гонять шум.
          # Берём только страницы и опись — то, что правда меняется по смыслу.
          #
          # data/catalog.json здесь НЕ упоминается, хотя раньше упоминался:
          # папка data/ в .gitignore, и `git add` на неё падал с кодом 1,
          # НИЧЕГО НЕ ДОБАВИВ В ИНДЕКС. Ошибку глотал `|| true`, дальше diff показывал
          # пустоту — и шаг честно печатал «коммитить нечего» на каждом
          # прогоне. Автосборка витрины не работала ни разу с самого начала.
          # Поэтому же здесь нет `|| true`: пусть падает громко.
          # -A по всей папке, а не список файлов: опись релиза
          # появляется и ИСЧЕЗАЕТ (релиз опубликовали, релиз сняли), а
          # `git add` на несуществующий путь падает и не добавляет ничего —
          # ровно та поломка, из-за которой этот шаг молчал месяц.
          git add -A docs ":(exclude)*.png"
          if git diff --cached --quiet; then
            echo "витрина не изменилась — коммитить нечего"
          else
            # [skip ci]: этот пуш меняет только собранные страницы. Гонять
            # из-за них полный прогон тестов — двадцать минут раннера ради
            # файлов, которые сам же раннер и сделал.
            #
            # ЛОВУШКА, на которую я уже попался: GitHub ищет эту пометку в
            # ЛЮБОЙ строке сообщения коммита, а не только в первой. Стоило
            # упомянуть её в объяснении к своему же коммиту — и ни tests, ни
            # site по нему не запустились вовсе. Ноль прогонов выглядит почти
            # как зелёный: галочки нет, но и красного нет. Писать её в
            # сообщении можно только тогда, когда прогон правда не нужен.
            git commit -m "site: пересобрано автоматически при пуше в main [skip ci]"
            git push
          fi
